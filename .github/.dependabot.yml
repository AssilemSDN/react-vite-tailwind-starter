version: 2

updates:
  # package.json + yarn.lock
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

    open-pull-requests-limit: 5

    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # docker/Dockerfile
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
