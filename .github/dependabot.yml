version: 2

updates:
  ### MAIN

  # package.json + yarn.lock
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

    open-pull-requests-limit: 3

    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    open-pull-requests-limit: 3

    allow:
      - dependency-name: "*"
