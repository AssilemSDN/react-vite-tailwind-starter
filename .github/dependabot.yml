version: 2

updates:
  # package.json + yarn.lock
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

    open-pull-requests-limit: 3

    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope

  # .github/workflows/*.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    open-pull-requests-limit: 3

    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    commit-message:
      prefix: "chore"
      include: scope

  # docker/Dockerfile
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

    open-pull-requests-limit: 3

    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch

    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

    commit-message:
      prefix: "chore"
      include: scope
